syntax = "proto3";

package mrpc;

// proto3 默认不生成 C++ service 抽象类（那是 gRPC 插件的事），
// 这里需要 protobuf 自带的反射分发代码，必须显式打开。
option cc_generic_services = true;

// RPC 帧的业务负载。
// 固定头只负责分帧，所有逻辑字段（含 seq）统一在这里定义，避免两处重复。
message RpcMessage {
  uint64 seq = 1;           // 请求序号，用于匹配响应（支持异步乱序返回）
  string service_name = 2;  // 服务名
  string method_name = 3;   // 方法名
  bytes payload = 4;        // 请求/响应的序列化业务数据
  int32 error_code = 5;     // 0 表示成功
  string error_msg = 6;
}

// ---- 端到端验证用的示例消息 ----

message EchoRequest {
  string text = 1;
}

message EchoResponse {
  string text = 1;
}

// ---- 示例服务 ----
// 声明 service 后，protoc 会生成抽象类 mrpc::EchoService，自带
// GetDescriptor() / CallMethod() / GetRequestPrototype()，
// 服务端据此在「不知道具体消息类型」的情况下完成通用分发。
service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
  // 故意不回调 done->Run() 的坏实现，用于验证请求级超时兜底：
  // 框架必须回 kRpcTimeout 并把这次请求占用的内存收回来，而不是泄漏。
  rpc NoReply(EchoRequest) returns (EchoResponse);
}
